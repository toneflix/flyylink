name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request stops the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each app builds only when its own code, or this workflow, changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/ci.yml'
            macos:
              - 'macos/**'
              - '.github/workflows/ci.yml'
            windows:
              - 'windows/**'
              - '.github/workflows/ci.yml'

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Protocol tests
        run: ./gradlew :protocol:test
      - name: Build app
        run: ./gradlew :app:assembleDebug
      - name: Build the shrunk release app
        run: ./gradlew :app:assembleRelease

  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      # Liquid Glass needs the macOS 26 SDK, so build with Xcode 26 when the runner has it.
      - name: Pick Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          swift --version
      - uses: actions/cache@v5
        with:
          path: macos/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('macos/Package.resolved') }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-${{ hashFiles('macos/Package.resolved') }}-
      - name: Test
        run: swift test
      - name: Bundle app
        run: ./scripts/bundle.sh

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Protocol tests
        run: dotnet test tests/FlyyLink.Core.Tests
      - name: Build app and installer
        run: ./scripts/package.ps1
      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: FlyyLink-windows-x64
          path: windows/publish/FlyyLink
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: FlyyLink-windows-setup
          path: windows/publish/FlyyLink-Setup-*.exe

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Build for Chrome, Edge and Firefox
        run: npm run store
      - name: Upload add-on
        uses: actions/upload-artifact@v7
        with:
          name: FlyyLink-browser
          path: browser/dist/*.zip
